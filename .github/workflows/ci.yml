name: ci

# Owner pull requests run no job: the `fast-tier` status that `ws ship` posts after the local fast tier is their gate.
# Fork and bot pull requests run the check and the job posts `fast-tier` for the bot ones. The full check runs on push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mods:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.303  # zizmor: ignore[adhoc-packages] exact version pin; claude-code is the tool the mods are validated against
      # scripts/check.sh also type-checks, but that needs claude-code.d.ts, which the
      # engine writes into a loaded mod and the repo does not hold. CI runs the rest.
      - name: Validate and test every mod
        run: |
          fail=0
          for mod in mods/*/; do
            echo "== $mod"
            claude plugin validate "$mod" || fail=1
            if ls "$mod"tests/*.test.ts >/dev/null 2>&1; then claude plugin test "$mod" || fail=1; fi
          done
          claude plugin validate . || fail=1
          exit $fail
      # A same-repository bot pull request has no local fast tier behind it: green here is its fast-tier.
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=fast-tier -f description="mods green on a bot pull request" > /dev/null
